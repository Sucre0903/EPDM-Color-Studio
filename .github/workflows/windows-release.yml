name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.17'
          architecture: x64
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: launcher/go.mod
          cache: false
      - name: Build both Windows packages
        shell: pwsh
        run: |
          python -m pip install -r tools/build-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ref = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'HEAD' }
          python tools/build_release.py --ref $ref --output dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error
          compression-level: 0
      - name: Windows launch smoke and application regression
        shell: pwsh
        run: ./tools/test_windows_release.ps1 -Dist dist

  draft:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-release
          path: dist
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag --draft --title "ZT Color Match Studio $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md
